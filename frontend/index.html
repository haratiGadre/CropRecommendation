<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Prediction App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #43cea2, #185a9d);
            color: white;
            text-align: center;
            padding-top: 15%;
        }
        .btn {
            text-decoration: none;
            color: white;
            background: #008CBA;
            padding: 12px 25px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #005f73;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>🌾 Welcome to the Smart Crop Prediction System</h1>
    <p>Get the best crop recommendation based on soil and weather data.</p>
    <a href="/prediction" class="btn">Predict Now</a>
</body>
</html>
